name: Fabric 26.3 build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-26.3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MINECRAFT_VERSION: "26.3"
  JAVA_VERSION: "25"

jobs:
  build:
    name: Build ChampionsCode for Minecraft 26.3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      mod_version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read and validate prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ -z "$version" ]]; then
            echo "Missing version in gradle.properties" >&2
            exit 1
          fi
          if [[ "$version" != *-* ]]; then
            echo "Automatic releases require a prerelease version such as 0.1.0-beta.1" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "Invalid prerelease version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify configured Fabric target
        shell: bash
        run: |
          grep -Fxq "minecraft_version=${MINECRAFT_VERSION}" gradle.properties
          grep -Fxq "loader_version=0.19.5" gradle.properties
          grep -Fxq "fabric_api_version=0.161.0+26.3" gradle.properties
          grep -Fq 'minecraft "com.mojang:minecraft:${project.minecraft_version}"' build.gradle
          grep -Fq 'implementation "net.fabricmc:fabric-loader:${project.loader_version}"' build.gradle
          grep -Fq 'implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"' build.gradle

      - name: Clean, test, and build Fabric mod
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify built mod metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          libs = pathlib.Path("build/libs")
          jars = sorted(path for path in libs.glob("champions-mod-*.jar") if not path.name.endswith("-sources.jar"))
          if len(jars) != 1:
              raise SystemExit(f"Expected one mod JAR, found: {[path.name for path in jars]}")

          properties = {}
          for line in pathlib.Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  key, value = line.split("=", 1)
                  properties[key.strip()] = value.strip()

          with zipfile.ZipFile(jars[0]) as archive:
              metadata = json.loads(archive.read("fabric.mod.json"))
              names = set(archive.namelist())

          expected = {
              "minecraft": "~26.3",
              "fabricloader": ">=0.19.5",
              "fabric-api": ">=0.161.0",
              "java": ">=25",
          }
          if metadata.get("version") != properties.get("version"):
              raise SystemExit(f"Version mismatch: {metadata.get('version')} != {properties.get('version')}")
          for dependency, requirement in expected.items():
              actual = metadata.get("depends", {}).get(dependency)
              if actual != requirement:
                  raise SystemExit(f"Unexpected {dependency} requirement: {actual!r}")
          if metadata.get("environment") != "client":
              raise SystemExit("Mod must remain client-only")
          if "champions.client.mixins.json" not in names:
              raise SystemExit("Client mixin configuration is missing from the built JAR")

          runtime_java_classes = {
              "dev/champions/api/java/ChampionRuntimeAddon.class",
              "dev/champions/api/java/ChampionJavaContext.class",
              "dev/champions/client/java/JavaRuntimeManager.class",
              "dev/champions/client/ui/ChampionsClickGuiScreen.class",
              "dev/champions/client/ui/ChampionsCategoryGuiScreen.class",
              "dev/champions/client/ui/ChampionsJavaScreen.class",
              "dev/champions/client/ui/WindowChrome.class",
              "dev/champions/client/ui/ExploitWarningScreen.class",
              "dev/champions/core/module/ExploitResearchModule.class",
              "dev/champions/core/module/builtin/ExploitResearchWorkspaceModule.class",
              "dev/champions/core/java/RuntimeJavaCompiler.class",
          }
          missing = runtime_java_classes - names
          if missing:
              raise SystemExit(f"Runtime Java classes missing from JAR: {sorted(missing)}")
          obsolete = sorted(name for name in names if "core/script/" in name or "ChampionScript" in name)
          if obsolete:
              raise SystemExit(f"Obsolete ChampionScript classes remain in JAR: {obsolete}")

          print(f"Verified {jars[0].name} for Fabric Minecraft 26.3 and runtime Java packaging")
          PY

      - name: Generate artifact checksums
        shell: bash
        run: |
          cd build/libs
          sha256sum *.jar | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Fabric mod artifacts
        uses: actions/upload-artifact@v7
        with:
          name: champions-mod-mc26.3-${{ github.sha }}
          path: |
            build/libs/champions-mod-*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Publish GitHub prerelease
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MOD_VERSION: ${{ needs.build.outputs.mod_version }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}

    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          name: champions-mod-mc26.3-${{ github.sha }}
          path: release-assets

      - name: Validate release assets and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$MOD_VERSION"
          test -f "release-assets/champions-mod-${MOD_VERSION}.jar"
          test -f "release-assets/champions-mod-${MOD_VERSION}-sources.jar"
          test -f "release-assets/SHA256SUMS.txt"
          (
            cd release-assets
            sha256sum -c SHA256SUMS.txt
          )

          existing_sha=""
          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            existing_sha="$tag_sha"
          fi
          if [[ -n "$existing_sha" && "$existing_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG already points to $existing_sha. Bump version before releasing $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Create or refresh GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \
            \( -name 'champions-mod-*.jar' -o -name 'SHA256SUMS.txt' \) -print | sort)
          if [[ "${#assets[@]}" -ne 3 ]]; then
            echo "Expected binary JAR, source JAR, and SHA256SUMS.txt; found ${#assets[@]} assets" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "ChampionsCode $MOD_VERSION" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "ChampionsCode $MOD_VERSION" \
              --prerelease \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
