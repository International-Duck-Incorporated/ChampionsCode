plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"champions" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The sources JAR is documentation, not a mod. Excluding fabric.mod.json keeps
// mod loaders from discovering and loading it if it is dropped into a mods
// folder by mistake (which happened during beta testing).
tasks.named('sourcesJar') {
	exclude('fabric.mod.json')
}

// Fabric Loom writes the "Fabric-Loom-Client-Only-Entries" manifest attribute in
// file-system walk order, which is not stable across machines and clean builds:
// three builds of identical sources produced three different jar hashes that
// differed ONLY in the ordering of that attribute. This hook rewrites the jar
// one final time with the attribute's entries sorted and every other property
// (entry order, timestamps, compression method) preserved, so clean builds are
// bit-for-bit reproducible.
import java.util.jar.Manifest
import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream
import java.util.zip.CRC32
tasks.named('jar') { jarTask ->
	doLast {
		File jarFile = jarTask.archiveFile.get().asFile
		if (jarFile == null || !jarFile.exists()) return
		List<Map.Entry<ZipEntry, byte[]>> original = new ArrayList<>()
		new ZipInputStream(new FileInputStream(jarFile)).withCloseable { zip ->
			ZipEntry entry
			while ((entry = zip.getNextEntry()) != null) {
				original.add(Map.entry(entry, zip.readAllBytes()))
			}
		}
		boolean changed = false
		for (int i = 0; i < original.size(); i++) {
			ZipEntry entry = original.get(i).key
			if (entry.name != 'META-INF/MANIFEST.MF') continue
			Manifest manifest = new Manifest(new ByteArrayInputStream(original.get(i).value))
			String attr = manifest.mainAttributes.getValue('Fabric-Loom-Client-Only-Entries')
			if (attr == null) continue
			String[] parts = attr.split(';')
			Arrays.sort(parts)
			String sorted = String.join(';', parts)
			if (sorted == attr) continue
			manifest.mainAttributes.putValue('Fabric-Loom-Client-Only-Entries', sorted)
			ByteArrayOutputStream rendered = new ByteArrayOutputStream()
			manifest.write(rendered)
			original.set(i, Map.entry(entry, rendered.toByteArray()))
			changed = true
		}
		if (!changed) return
		File tmp = new File(jarFile.parentFile, jarFile.name + '.reproducible.tmp')
		ZipOutputStream zipOut = new ZipOutputStream(new FileOutputStream(tmp))
		try {
			for (pair in original) {
				ZipEntry src = pair.key
				byte[] data = pair.value
				ZipEntry out = new ZipEntry(src.name)
				out.time = src.time
				out.method = src.method
				if (src.method == ZipEntry.STORED) {
					out.size = data.length
					CRC32 crc = new CRC32()
					crc.update(data)
					out.crc = crc.value
				}
				zipOut.putNextEntry(out)
				zipOut.write(data)
				zipOut.closeEntry()
			}
		} finally {
			zipOut.close()
		}
		java.nio.file.Files.move(tmp.toPath(), jarFile.toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
		println "reproducible-repack: sorted Fabric-Loom-Client-Only-Entries in ${jarFile.name}"
	}
}

def packagedLicenseName = "LICENSE_${project.name}"
jar {
	from('LICENSE') { rename { packagedLicenseName } }
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

// ---------------------------------------------------------------------------
// Desktop application packaging.
//
// The mod JAR is also the external ChampionsCode app: Fabric ignores
// Main-Class entirely, while `java -jar champions-mod-<version>.jar` starts the
// Swing front end with no Minecraft classes on its classpath.
//
// Loom publishes the remapped JAR (remapJar) and keeps the plain jar as the
// pre-remap artifact, so the attribute is set on whichever of the two exist and
// the self-test runs against the file users actually download.
// ---------------------------------------------------------------------------
ext.desktopMainClass = 'dev.champions.desktop.DesktopMain'

tasks.matching { it.name == 'jar' || it.name == 'remapJar' }.configureEach { archiveTask ->
	if (archiveTask.hasProperty('manifest')) {
		archiveTask.manifest {
			attributes('Main-Class': project.ext.desktopMainClass)
		}
	}
}

// Headless proof that the desktop half really runs without Minecraft: the
// terminal model, the wire codec, the gated console session, the version gate
// and the drop-in compiler, plus an assertion that no Minecraft/Fabric class is
// even loadable. CI runs the same check against the packaged JAR.
//
// The classpath is resolved at execution time so it always picks the shipped
// (remapped) JAR, whichever filename Loom produced for this Gradle version.
tasks.register('desktopSelfTest', JavaExec) {
	dependsOn 'build'
	group = 'verification'
	description = 'Runs the desktop app self-test from the built mod JAR (no Minecraft on the classpath).'
	mainClass = project.ext.desktopMainClass
	args '--self-test'
	doFirst {
		def libs = project.layout.buildDirectory.dir('libs').get().asFile
		def candidate = new File(libs, "${project.archives_base_name}-${project.version}.jar")
		if (!candidate.exists()) {
			candidate = (libs.listFiles() ?: new File[0]).find { file ->
				file.name.endsWith('.jar') && !file.name.contains('sources') && !file.name.contains('-dev')
			}
		}
		if (candidate == null || !candidate.exists()) {
			throw new GradleException("No packaged JAR in ${libs}; run a full build first.")
		}
		println "Self-testing ${candidate.name}"
		classpath = files(candidate)
	}
}
